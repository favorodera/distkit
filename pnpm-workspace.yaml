shellEmulator: true

trustPolicy: no-downgrade

packages:
  - 'packages/**'

catalog:
    '@clack/prompts': ^1.9.0
    '@favorodera/eslint-config': ^3.6.0
    '@types/fs-extra': ^11.0.4
    '@types/node': ^26.6.6
    '@vitest/ui': ^4.1.12
    c12: 4.0.0-rc.4
    citty: ^0.2.2
    eslint: ^10.15.0
    fs-extra: ^11.4.1
    json5: ^2.2.3
    nypm: ^0.6.12
    ofetch: ^1.5.1
    pathe: ^2.0.3
    pkg-pr-new: ^0.0.94
    relizy: ^1.14.4
    tinyglobby: ^0.2.17
    tsdown: ^0.23.7
    tsx: ^4.23.15
    turbo: ^2.11.13
    typebox: ^1.4.7
    typescript: ^6.0.3
    vitest: ^4.1.12
    yaml: ^2.9.1
nodeOptions: --max_old_space_size=4096

peerDependencyRules:
